[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-dashboard"
version = "0.1.0"
description = "Dashboard operativi interni DataCivicLab — pipeline, radar, metriche"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "DataCivicLab"}]

dependencies = [
    "streamlit>=1.62.0",
    "altair>=6.2.2",
    "pandas>=3.0.5",
    "duckdb>=1.5.5",
    "requests>=2.34.2",
    "pyyaml>=6.0.3",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.pytest.ini_options]
markers = [
    "contract: interfaccia pubblica, contratto API, path contract, formato output",
    "policy: regola Lab non ovvia",
    "regression: bug fix documentato in issue/PR",
    "adapter: adapter a servizio esterno (HTTP, DuckDB, GraphQL)",
    "pure_unit: logica pura non banale, zero side effect",
    "smoke: Smoke test che richiede connettivita' di rete (HTTP reale).",
]
testpaths = ["tests"]
