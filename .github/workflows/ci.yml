name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extra-packages: ruff

      - uses: dataciviclab/.github/actions/python-ci@main
        with:
          lint_paths: "."
          mypy_paths: ""
          test_dir: "tests"
          pytest_args: "-v -m \"not smoke\""
          cov_module: "sources"
          cov_report: "term"
          cov_threshold: "65"

      - name: Smoke test (rete, solo su main)
        if: github.ref == 'refs/heads/main'
        run: >
          python -m pytest tests/ -v -m "smoke"
          --cov=sources --cov-report=term
